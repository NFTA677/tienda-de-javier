# Levanta la tienda completa con una base de datos MongoDB local:
#   docker compose up --build
# Luego abre http://localhost:3000
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/tienda
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto}
      PORT: 3000
    depends_on:
      - mongo

volumes:
  mongo-data:
