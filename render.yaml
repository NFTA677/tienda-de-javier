services:
  # Un solo servicio: API Express + MongoDB que además sirve el frontend React
  - type: web
    name: tienda-de-javier
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false   # URL de MongoDB Atlas
      - key: JWT_SECRET
        generateValue: true
